{% extends "base.html" %}

{% block meta %}<title>Change Password | {{ site.business_name }}</title>{% endblock %}

{% block content %}
<section class="pt-28 pb-20 max-w-md mx-auto px-6">
  <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
    <div class="flex items-center justify-between mb-6"><h1 class="text-2xl font-bold text-slate-900">Change Password</h1><a href="{{ url_for('admin.dashboard') }}" class="text-sm text-slate-500">Back</a></div>
    {% if error %}<div class="mb-4 p-3 rounded-xl bg-red-50 text-red-700 text-sm">{{ error }}</div>{% endif %}
    {% if saved %}<div class="mb-4 p-3 rounded-xl bg-green-50 text-green-700 text-sm">Password changed successfully.</div>{% endif %}
    <form method="POST" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ session.get('csrf_token', '') }}">
      <label class="block text-sm font-semibold text-slate-700">Current password<input type="password" name="current_password" required class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3"></label>
      <label class="block text-sm font-semibold text-slate-700">New password<input type="password" name="new_password" minlength="12" required class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3"></label>
      <label class="block text-sm font-semibold text-slate-700">Confirm new password<input type="password" name="confirm_password" minlength="12" required class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3"></label>
      <button class="w-full rounded-xl bg-slate-900 text-white font-bold py-3" type="submit">Update Password</button>
    </form>
  </div>
</section>
{% endblock %}
