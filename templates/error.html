{% extends "base.html" %}

{% block meta %}<title>{{ code }} | {{ site.business_name }}</title>{% endblock %}

{% block content %}
<section class="min-h-[70vh] bg-burgundy-900 flex items-center justify-center text-center px-6 pt-24">
  <div>
    <p class="font-display text-7xl font-bold text-gold-300">{{ code }}</p>
    <h1 class="font-display text-3xl font-bold text-ivory mt-4">{{ message }}</h1>
    <a href="/" class="inline-block mt-8 gold-pill-btn px-8 py-3 rounded-full font-bold uppercase tracking-wider text-xs">Return Home</a>
  </div>
</section>
{% endblock %}
