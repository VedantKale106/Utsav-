{% extends "base.html" %}

{% block meta %}
<title>Admin Login — Utsav Banquet Hall</title>
{% endblock %}

{% block content %}
<div class="pt-32 pb-16 bg-charcoal text-center">
  <h1 class="font-display text-4xl text-white font-bold">Admin Login</h1>
</div>

<section class="py-20 max-w-md mx-auto px-6">
  <div class="bg-white border border-gold-100 rounded-3xl p-8 shadow-sm">
    {% if error %}
    <div class="mb-4 p-3 bg-red-100 text-red-600 rounded-xl text-sm font-medium">
      {{ error }}
    </div>
    {% endif %}
    
    <form method="POST" action="{{ url_for('admin.login') }}">
      <div class="mb-6">
        <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-2">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          class="w-full border border-gray-200 rounded-xl px-4 py-3.5 text-sm text-charcoal focus:outline-none focus:border-gold-400 focus:ring-2 focus:ring-gold-100 transition-all"
          required
        />
      </div>
      <div class="mb-6">
        <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-2">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          class="w-full border border-gray-200 rounded-xl px-4 py-3.5 text-sm text-charcoal focus:outline-none focus:border-gold-400 focus:ring-2 focus:ring-gold-100 transition-all"
          required
        />
      </div>
      <button
        type="submit"
        class="w-full bg-gold-500 hover:bg-gold-600 text-white font-semibold tracking-wider uppercase text-sm py-4 rounded-full transition-all duration-300"
      >
        Login
      </button>
    </form>
  </div>
</section>
{% endblock %}
